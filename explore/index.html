<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-12 知识图谱浏览器</title>
    <link rel="manifest" href="../manifest.webmanifest">
    <meta name="theme-color" content="#0f6e62">
    <link rel="stylesheet" href="../assets/site.css">
    <style>
        /* 页面级布局：颜色与组件来自 ../assets/site.css */
        html, body { height: 100%; }
        body { background: var(--bg); }

        .page-toolbar {
            display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
            padding: 10px 18px; background: var(--card);
            border-bottom: 1px solid var(--line);
        }
        .page-toolbar label {
            display: inline-flex; align-items: center; gap: 8px;
            font-size: 13px; color: var(--ink-2);
        }
        .page-toolbar select {
            min-height: 36px; padding: 0 10px; font-size: 14px;
            color: var(--ink); background: var(--card);
            border: 1px solid var(--line); border-radius: 9px; cursor: pointer;
        }
        .page-toolbar select:focus { outline: 2px solid var(--brand); outline-offset: 1px; }
        .page-toolbar .toolbar-hint { margin-left: auto; font-size: 12.5px; color: var(--ink-3); }

        .main {
            display: flex; height: calc(100vh - 51px - 57px); min-height: 420px;
        }
        .sidebar {
            width: 312px; flex: none; overflow-y: auto; padding: 14px;
            background: var(--card); border-right: 1px solid var(--line);
        }
        .sidebar h3 {
            margin: 2px 0 10px; font-size: 12px; font-weight: 700;
            letter-spacing: .08em; color: var(--ink-3); text-transform: none;
        }
        .topic-list { list-style: none; margin: 0; padding: 0; }
        .topic-list li {
            padding: 9px 11px; margin-bottom: 4px; border-radius: 9px;
            font-size: 13.5px; color: var(--ink); cursor: pointer;
            border: 1px solid transparent;
        }
        .topic-list li:hover { background: var(--brand-soft); color: var(--brand-ink); }
        .topic-list li.active {
            background: var(--brand); border-color: var(--brand); color: #fff;
        }
        .topic-list li.active .grade { color: rgba(255,255,255,.85); }
        .topic-list li .grade { font-size: 11.5px; color: var(--ink-3); margin-left: 6px; }

        .graph-area { flex: 1; position: relative; overflow: hidden; background: var(--bg); }
        #graph-canvas { width: 100%; height: 100%; display: block; }

        .info-panel {
            position: absolute; top: 16px; right: 16px; width: 320px; max-height: calc(100% - 32px);
            overflow-y: auto; display: none; padding: 18px;
            background: var(--card); border: 1px solid var(--line);
            border-radius: var(--radius); box-shadow: var(--shadow);
        }
        .info-panel.show { display: block; }
        .info-panel h3 { margin: 0 26px 8px 0; font-size: 17px; color: var(--ink); }
        .info-panel .meta { font-size: 12.5px; color: var(--ink-3); margin-bottom: 12px; }
        .info-panel .desc { font-size: 13.5px; line-height: 1.7; color: var(--ink-2); }
        .info-panel .desc h4 { margin: 12px 0 4px; font-size: 13px; color: var(--ink); }
        .info-panel .desc ul { margin: 4px 0 0 18px; }
        .info-panel .close {
            position: absolute; top: 8px; right: 12px; font-size: 22px; line-height: 1;
            color: var(--ink-3); cursor: pointer; background: none; border: 0;
        }
        .info-panel .close:hover { color: var(--ink); }

        .legend {
            position: absolute; left: 16px; bottom: 16px; padding: 12px 14px;
            background: var(--card); border: 1px solid var(--line);
            border-radius: var(--radius-sm); box-shadow: var(--shadow); font-size: 12.5px;
        }
        .legend-item { display: flex; align-items: center; margin-bottom: 7px; color: var(--ink-2); }
        .legend-item:last-child { margin-bottom: 0; }
        .legend-color { width: 18px; height: 18px; border-radius: 5px; margin-right: 9px; flex: none; }

        .node { cursor: pointer; }
        .node circle { stroke: var(--card); stroke-width: 2px; transition: stroke-width .15s; }
        .node:hover circle { stroke-width: 4px; }
        .node text { font-size: 12px; fill: var(--ink); pointer-events: none; }
        .link { stroke: var(--ink-3); stroke-opacity: .55; stroke-width: 1.8px; }
        .link.hard { stroke: var(--brand); stroke-opacity: .85; }
        .link.soft { stroke: var(--ink-3); stroke-dasharray: 5,5; }

        @media (max-width: 820px) {
            .main { flex-direction: column; height: auto; }
            .sidebar { width: 100%; max-height: 34vh; border-right: 0; border-bottom: 1px solid var(--line); }
            .graph-area { height: 58vh; }
            .info-panel { left: 12px; right: 12px; width: auto; }
            .legend { display: none; }
        }

        /* 工具栏新增控件 */
        .page-toolbar .search-wrap input {
            min-height: 36px; width: 190px; padding: 0 10px; font-size: 13.5px;
            color: var(--ink); background: var(--card);
            border: 1px solid var(--line); border-radius: 9px;
        }
        .page-toolbar .search-wrap input:focus { outline: 2px solid var(--brand); outline-offset: 1px; }
        .page-toolbar .tool-btn {
            min-height: 36px; padding: 0 12px; font-size: 13px; font-weight: 600;
            color: var(--ink); background: var(--card);
            border: 1px solid var(--line); border-radius: 9px; cursor: pointer;
        }
        .page-toolbar .tool-btn:hover { border-color: var(--brand); color: var(--brand-ink); }

        .list-count { font-weight: 400; color: var(--ink-3); letter-spacing: 0; }
        .topic-list li .t-name { display: inline; }
        .topic-list li .grade { float: right; }

        /* 图内元素 */
        .node.center circle { filter: drop-shadow(0 2px 6px rgba(15,110,98,.35)); }
        .node.up circle { opacity: .96; }
        .node.down circle { opacity: .9; }
        .node-label { paint-order: stroke; stroke: var(--card); stroke-width: 3px; stroke-linejoin: round; }
        .empty-title { font-size: 15px; fill: var(--ink-2); font-weight: 600; }
        .empty-sub { font-size: 12.5px; fill: var(--ink-3); }

        /* 详情面板内结构 */
        .info-panel .desc .kv { font-size: 13px; color: var(--ink-2); margin: 4px 0 10px; line-height: 1.7; }
        .info-panel .desc .desc-p { margin: 0 0 10px; font-size: 13.5px; line-height: 1.7; color: var(--ink-2); }
        .info-panel .desc h4 { margin: 12px 0 4px; font-size: 12.5px; color: var(--ink-3); font-weight: 700; }
        .info-panel .desc ul { margin: 4px 0 8px 18px; padding: 0; font-size: 13px; color: var(--ink-2); }
        .info-panel .desc a { color: var(--brand); }
        .info-panel .desc .soft-tag { color: var(--ink-3); font-size: 11.5px; }

        /* 学段 tabs */
        .stage-tabs { display: inline-flex; gap: 2px; padding: 3px; background: var(--bg);
            border: 1px solid var(--line); border-radius: 10px; }
        .stage-tabs button {
            min-height: 30px; padding: 0 10px; font-size: 13px; color: var(--ink-2);
            background: transparent; border: 0; border-radius: 7px; cursor: pointer;
        }
        .stage-tabs button.on { background: var(--brand); color: #fff; font-weight: 650; }

        /* 按册分组列表 */
        .book-group { border-bottom: 1px solid var(--line); padding: 2px 0 6px; }
        .book-group > summary {
            display: flex; justify-content: space-between; align-items: center;
            padding: 7px 6px; cursor: pointer; font-size: 12.5px; font-weight: 700;
            color: var(--ink-3); letter-spacing: .02em; list-style: none;
        }
        .book-group > summary::-webkit-details-marker { display: none; }
        .book-group > summary:hover { color: var(--brand-ink); }
        .book-group > summary em { font-style: normal; font-weight: 600; color: var(--ink-3); }
        .topic-item {
            display: flex; justify-content: space-between; gap: 8px;
            padding: 7px 9px; margin: 1px 0; border-radius: 8px;
            font-size: 13.5px; color: var(--ink); cursor: pointer; list-style: none;
            border: 1px solid transparent;
        }
        .topic-item:hover { background: var(--brand-soft); color: var(--brand-ink); }
        .topic-item.active { background: var(--brand); border-color: var(--brand); color: #fff; }
        .topic-item.active .grade { color: rgba(255,255,255,.85); }
        .topic-item .t-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .topic-item .grade { flex: none; font-size: 11.5px; color: var(--ink-3); }
        .list-empty { padding: 14px 8px; font-size: 13px; color: var(--ink-3); line-height: 1.7; }

        /* 详情卡：课标条目 / 样题 / 诊断按钮 */
        .info-panel .desc .std-list { list-style: none; margin: 4px 0 8px; padding: 0; }
        .info-panel .desc .std-list li { margin-bottom: 8px; }
        .info-panel .desc code { font-size: 11.5px; background: var(--bg); padding: 1px 5px; border-radius: 5px; }
        .info-panel .desc .conf { font-size: 11px; padding: 1px 6px; border-radius: 99px; margin-left: 4px; }
        .info-panel .desc .conf.exact { background: #dff3ef; color: #0a4c44; }
        .info-panel .desc .conf.partial { background: #fff3d6; color: #7a5a12; }
        .info-panel .desc .conf.inferred { background: #eef1f5; color: #4a5966; }
        .info-panel .desc details.quote { margin-top: 5px; }
        .info-panel .desc details.quote summary { cursor: pointer; font-size: 12px; color: var(--brand); }
        .info-panel .desc blockquote {
            margin: 6px 0 2px; padding: 8px 10px; font-size: 12.5px; line-height: 1.7;
            color: var(--ink-2); background: var(--bg); border-left: 3px solid var(--brand);
            border-radius: 0 6px 6px 0;
        }
        .info-panel .desc .src { font-size: 11px; color: var(--ink-3); margin-top: 2px; }
        .info-panel .desc .sample { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
        .info-panel .desc .sample .q { font-size: 13px; color: var(--ink); line-height: 1.7; }
        .info-panel .desc .sample details { margin-top: 6px; }
        .info-panel .desc .sample summary { cursor: pointer; font-size: 12px; color: var(--brand); }
        .info-panel .desc .sample .a { font-size: 12.5px; color: var(--brand-ink); margin-top: 4px; }
        .info-panel .desc .muted { color: var(--ink-3); font-size: 12.5px; }
        .info-panel .desc .btn-diag {
            display: block; margin-top: 14px; padding: 10px 12px; text-align: center;
            background: var(--brand); color: #fff; border-radius: 9px; font-weight: 650; font-size: 13.5px;
        }
        .info-panel .desc .btn-diag:hover { background: var(--brand-ink); text-decoration: none; }
    </style>
</head>
<body>
<header class="site-header">
  <a class="brand" href="../">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
      <circle cx="7" cy="7" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <circle cx="25" cy="7" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <circle cx="7" cy="25" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <circle cx="25" cy="25" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <path d="M10.2 7h11.6M7 10.2v11.6M25 10.2v11.6M10.2 25h11.6" stroke="currentColor" stroke-width="1.5"/>
    </svg>
    <span class="brand-copy">
      <span class="brand-name">中国 K-12 知识图谱</span>
      <span class="brand-kicker">知识图谱 · 先修关系</span>
    </span>
  </a>
  <nav class="site-nav" aria-label="主导航">
    <a class="nav-link" href="../">首页</a>
    <a class="nav-link active" href="./">知识图谱</a>
    <a class="nav-link " href="../diagnose/">诊断</a>
    <a class="nav-link" href="../children/">档案</a>
    <a class="nav-link" href="../contact/">联系</a>
    <a class="nav-link" href="https://github.com/grantleyzyf-spec/cn-k12-dxyc2286" target="_blank" rel="noopener noreferrer">关于</a>
  </nav>
</header>
    <div class="page-toolbar">
        <label>学科
            <select id="subject-select">
                <option value="math">📐 数学</option>
                <option value="chinese">📖 语文</option>
                <option value="english">🔤 英语</option>
                <option value="physics">⚡ 物理</option>
                <option value="chemistry">🧪 化学</option>
                <option value="biology">🧬 生物</option>
                <option value="history">📜 历史</option>
                <option value="geography">🌍 地理</option>
                <option value="science">🔬 科学</option>
                <option value="information-technology">💻 信息科技</option>
                <option value="japanese">🇯🇵 日语</option>
                <option value="russian">🇷🇺 俄语</option>
                <option value="german">🇩🇪 德语</option>
                <option value="french">🇫🇷 法语</option>
                <option value="spanish">🇪🇸 西班牙语</option>
                <option value="music">🎵 音乐</option>
                <option value="art">🎨 美术</option>
            </select>
        </label>
        <div class="stage-tabs" id="stage-tabs" role="tablist" aria-label="学段">
            <button type="button" data-stage="all" class="on">全部</button>
            <button type="button" data-stage="primary">小学</button>
            <button type="button" data-stage="junior">初中</button>
            <button type="button" data-stage="senior">高中</button>
        </div>
        <label>年级
            <select id="grade-select">
                <option value="all">全部年级</option>
                <option value="1">一年级</option>
                <option value="2">二年级</option>
                <option value="3">三年级</option>
                <option value="4">四年级</option>
                <option value="5">五年级</option>
                <option value="6">六年级</option>
                <option value="7">七年级</option>
                <option value="8">八年级</option>
                <option value="9">九年级</option>
                <option value="10">必修一</option>
                <option value="11">必修二</option>
                <option value="12">选必一</option>
                <option value="13">选必二</option>
                <option value="14">选必三</option>
            </select>
        </label>
        <label>领域
            <select id="domain-select"><option value="all">全部领域</option></select>
        </label>
        <label class="search-wrap">搜索
            <input id="topic-search" type="search" placeholder="名称 / 章节 / 领域" autocomplete="off">
        </label>
        <label>向上先修
            <select id="depth-select">
                <option value="1">1 层</option>
                <option value="2" selected>2 层</option>
                <option value="3">3 层</option>
                <option value="all">全部祖先</option>
            </select>
        </label>
        <button class="tool-btn" id="zoom-out" type="button" aria-label="缩小">−</button>
        <button class="tool-btn" id="zoom-in" type="button" aria-label="放大">＋</button>
        <button class="tool-btn" id="fit-btn" type="button">适配画面</button>
        <button class="tool-btn" id="reset-btn" type="button">回到首个</button>
        <span class="toolbar-hint" id="graph-meta">选一个知识点开始</span>
    </div>
    <div class="main">
        <div class="sidebar">
            <h3>知识点列表 <span class="list-count" id="list-count">—</span></h3>
            <ul class="topic-list" id="topic-list"></ul>
        </div>
        <div class="graph-area">
            <svg id="graph-canvas"></svg>
            <div class="info-panel" id="info-panel">
                <button class="close" id="info-close" type="button" aria-label="关闭">×</button>
                <h3 id="info-title"></h3>
                <div class="meta" id="info-meta"></div>
                <div class="desc" id="info-desc"></div>
            </div>
            <div class="legend">
                <div class="legend-item">
                    <div class="legend-color" style="background: var(--primary);"></div>
                    <span>小学 (1-6年级)</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: var(--junior);"></div>
                    <span>初中 (7-9年级)</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: var(--senior);"></div>
                    <span>高中（必修 / 选必）</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: var(--brand); width: 30px; height: 3px;"></div>
                    <span>必先修（实线）</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: none; border-top: 2px dashed var(--ink-3); width: 30px; height: 0;"></div>
                    <span>建议先修（虚线）</span>
                </div>
            </div>
        </div>
    </div>

    <script src="../assets/vendor/d3.v7.min.js"></script>
    <script src="app.js"></script>
    <script>
        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('../sw.js').catch(err => console.log('SW registration failed:', err));
        }
    </script>
</body>
</html>
