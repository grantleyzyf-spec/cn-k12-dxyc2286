<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-12 知识图谱浏览器</title>
    <link rel="manifest" href="../manifest.webmanifest">
    <meta name="theme-color" content="#0f6e62">
    <link rel="stylesheet" href="../assets/site.css">
    <style>
        /* 页面级布局：颜色与组件来自 ../assets/site.css */
        html, body { height: 100%; }
        body { background: var(--bg); }

        .page-toolbar {
            display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
            padding: 10px 18px; background: var(--card);
            border-bottom: 1px solid var(--line);
        }
        .page-toolbar label {
            display: inline-flex; align-items: center; gap: 8px;
            font-size: 13px; color: var(--ink-2);
        }
        .page-toolbar select {
            min-height: 36px; padding: 0 10px; font-size: 14px;
            color: var(--ink); background: var(--card);
            border: 1px solid var(--line); border-radius: 9px; cursor: pointer;
        }
        .page-toolbar select:focus { outline: 2px solid var(--brand); outline-offset: 1px; }
        .page-toolbar .toolbar-hint { margin-left: auto; font-size: 12.5px; color: var(--ink-3); }

        .main {
            display: flex; height: calc(100vh - 51px - 57px); min-height: 420px;
        }
        .sidebar {
            width: 312px; flex: none; overflow-y: auto; padding: 14px;
            background: var(--card); border-right: 1px solid var(--line);
        }
        .sidebar h3 {
            margin: 2px 0 10px; font-size: 12px; font-weight: 700;
            letter-spacing: .08em; color: var(--ink-3); text-transform: none;
        }
        .topic-list { list-style: none; margin: 0; padding: 0; }
        .topic-list li {
            padding: 9px 11px; margin-bottom: 4px; border-radius: 9px;
            font-size: 13.5px; color: var(--ink); cursor: pointer;
            border: 1px solid transparent;
        }
        .topic-list li:hover { background: var(--brand-soft); color: var(--brand-ink); }
        .topic-list li.active {
            background: var(--brand); border-color: var(--brand); color: #fff;
        }
        .topic-list li.active .grade { color: rgba(255,255,255,.85); }
        .topic-list li .grade { font-size: 11.5px; color: var(--ink-3); margin-left: 6px; }

        .graph-area { flex: 1; position: relative; overflow: hidden; background: var(--bg); }
        #graph-canvas { width: 100%; height: 100%; display: block; }

        .info-panel {
            position: absolute; top: 16px; right: 16px; width: 320px; max-height: calc(100% - 32px);
            overflow-y: auto; display: none; padding: 18px;
            background: var(--card); border: 1px solid var(--line);
            border-radius: var(--radius); box-shadow: var(--shadow);
        }
        .info-panel.show { display: block; }
        .info-panel h3 { margin: 0 26px 8px 0; font-size: 17px; color: var(--ink); }
        .info-panel .meta { font-size: 12.5px; color: var(--ink-3); margin-bottom: 12px; }
        .info-panel .desc { font-size: 13.5px; line-height: 1.7; color: var(--ink-2); }
        .info-panel .desc h4 { margin: 12px 0 4px; font-size: 13px; color: var(--ink); }
        .info-panel .desc ul { margin: 4px 0 0 18px; }
        .info-panel .close {
            position: absolute; top: 8px; right: 12px; font-size: 22px; line-height: 1;
            color: var(--ink-3); cursor: pointer; background: none; border: 0;
        }
        .info-panel .close:hover { color: var(--ink); }

        .legend {
            position: absolute; left: 16px; bottom: 16px; padding: 12px 14px;
            background: var(--card); border: 1px solid var(--line);
            border-radius: var(--radius-sm); box-shadow: var(--shadow); font-size: 12.5px;
        }
        .legend-item { display: flex; align-items: center; margin-bottom: 7px; color: var(--ink-2); }
        .legend-item:last-child { margin-bottom: 0; }
        .legend-color { width: 18px; height: 18px; border-radius: 5px; margin-right: 9px; flex: none; }

        .node { cursor: pointer; }
        .node circle { stroke: var(--card); stroke-width: 2px; transition: stroke-width .15s; }
        .node:hover circle { stroke-width: 4px; }
        .node text { font-size: 12px; fill: var(--ink); pointer-events: none; }
        .link { stroke: var(--ink-3); stroke-opacity: .55; stroke-width: 1.8px; }
        .link.hard { stroke: var(--brand); stroke-opacity: .85; }
        .link.soft { stroke: var(--ink-3); stroke-dasharray: 5,5; }

        @media (max-width: 820px) {
            .main { flex-direction: column; height: auto; }
            .sidebar { width: 100%; max-height: 34vh; border-right: 0; border-bottom: 1px solid var(--line); }
            .graph-area { height: 58vh; }
            .info-panel { left: 12px; right: 12px; width: auto; }
            .legend { display: none; }
        }
    </style>
</head>
<body>
<header class="site-header">
  <a class="brand" href="../">

      <circle cx="7" cy="7" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <circle cx="25" cy="7" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <circle cx="7" cy="25" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <circle cx="25" cy="25" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <path d="M10.2 7h11.6M7 10.2v11.6M25 10.2v11.6M10.2 25h11.6" stroke="currentColor" stroke-width="1.5"/>
    </svg>
    <span class="brand-copy">
      <span class="brand-name">中国 K-12 知识图谱</span>

    </span>
  </a>
  <nav class="site-nav" aria-label="主导航">
    <a class="nav-link" href="../">首页</a>
    <a class="nav-link active" href="./">知识图谱</a>
    <a class="nav-link " href="../diagnose/">诊断</a>

</header>
    <div class="page-toolbar">
        <label>学科
            <select id="subject-select">
                <option value="math">📐 数学</option>
                <option value="chinese">📖 语文</option>
                <option value="english">🔤 英语</option>
                <option value="physics">⚡ 物理</option>
                <option value="chemistry">🧪 化学</option>
                <option value="biology">🧬 生物</option>
                <option value="history">📜 历史</option>
                <option value="geography">🌍 地理</option>
                <option value="science">🔬 科学</option>
                <option value="information-technology">💻 信息科技</option>
                <option value="japanese">🇯🇵 日语</option>
                <option value="russian">🇷🇺 俄语</option>
                <option value="german">🇩🇪 德语</option>
                <option value="french">🇫🇷 法语</option>
                <option value="spanish">🇪🇸 西班牙语</option>
                <option value="music">🎵 音乐</option>
                <option value="art">🎨 美术</option>
            </select>
        </label>
        <label>年级
            <select id="grade-select">
                <option value="all">全部年级</option>
                <option value="1">一年级</option>
                <option value="2">二年级</option>
                <option value="3">三年级</option>
                <option value="4">四年级</option>
                <option value="5">五年级</option>
                <option value="6">六年级</option>
                <option value="7">七年级</option>
                <option value="8">八年级</option>
                <option value="9">九年级</option>
                <option value="10">高一</option>
                <option value="11">高二</option>
                <option value="12">高三</option>
            </select>
        </label>
        <span class="toolbar-hint">点左侧知识点查看先修关系；线条实线为必先修、虚线为建议先修</span>
    </div>
    <div class="main">
        <div class="sidebar">
            <h3>知识点列表</h3>
            <ul class="topic-list" id="topic-list"></ul>
        </div>
        <div class="graph-area">
            <svg id="graph-canvas"></svg>
            <div class="info-panel" id="info-panel">
                <span class="close" onclick="closeInfo()">×</span>
                <h3 id="info-title"></h3>
                <div class="meta" id="info-meta"></div>
                <div class="desc" id="info-desc"></div>
            </div>
            <div class="legend">
                <div class="legend-item">
                    <div class="legend-color" style="background: var(--primary);"></div>
                    <span>小学 (1-6年级)</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: var(--junior);"></div>
                    <span>初中 (7-9年级)</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: var(--senior);"></div>
                    <span>高中 (10-12年级)</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: var(--brand); width: 30px; height: 3px;"></div>
                    <span>必须先修 (hard)</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: none; border-top: 2px dashed var(--ink-3); width: 30px; height: 0;"></div>
                    <span>建议先修 (soft)</span>
                </div>
            </div>
        </div>
    </div>

    <script src="../assets/vendor/d3.v7.min.js"></script>
    <script>
        let topicsData = [];
        let dependenciesData = [];
        let currentSubject = new URLSearchParams(location.search).get('subject') || 'math';
        let currentGrade = 'all';

        // 颜色映射
        function getColor(grade) {
            if (grade <= 6) return '#667eea';
            if (grade <= 9) return '#764ba2';
            return '#f093fb';
        }

        // 获取学科的topics文件列表
        function getTopicsFiles(subject) {
            // v2：topics.json 已含全部学段（grade 拆分文件仅作归档，不再叠加，避免重复）
            return ['topics.json'];
        }

        // 获取学科的dependencies文件列表
        function getDepsFiles(subject) {
            return ['dependencies.json'];
        }

        // 加载数据
        async function loadData() {
            try {
                // 加载所有topics文件
                const topicFiles = getTopicsFiles(currentSubject);
                let allTopics = [];
                for (const file of topicFiles) {
                    const response = await fetch(`../data/${currentSubject}/${file}`);
                    if (response.ok) {
                        const data = await response.json();
                        allTopics = allTopics.concat(data);
                    }
                }
                topicsData = Array.from(new Map(allTopics.map(t => [t.id, t])).values());
                
                // 加载所有dependencies文件
                const depsFiles = getDepsFiles(currentSubject);
                let allDeps = [];
                for (const file of depsFiles) {
                    const response = await fetch(`../data/${currentSubject}/${file}`);
                    if (response.ok) {
                        const data = await response.json();
                        allDeps = allDeps.concat(data);
                    }
                }
                dependenciesData = Array.from(new Map(allDeps.map(d => [`${d.from}->${d.to}:${d.type}`, d])).values());
                
                updateTopicList();
                renderGraph();
            } catch (e) {
                console.error('数据加载失败:', e);
            }
        }

        // 更新知识点列表
        function updateTopicList() {
            const list = document.getElementById('topic-list');
            list.innerHTML = '';
            
            let filtered = topicsData;
            if (currentGrade !== 'all') {
                filtered = topicsData.filter(t => t.grade === parseInt(currentGrade));
            }
            
            filtered.sort((a, b) => a.grade - b.grade || a.id.localeCompare(b.id));
            
            filtered.forEach(topic => {
                const li = document.createElement('li');
                li.innerHTML = `${topic.name}<span class="grade">${getGradeText(topic.grade)}</span>`;
                li.onclick = () => focusTopic(topic);
                list.appendChild(li);
            });
        }

        function getGradeText(grade) {
            if (grade <= 6) return `${grade}年级`;
            if (grade <= 9) return `${grade - 6}年级(初)`;
            return `高${grade - 9}`;
        }

        // 渲染图谱
        function renderGraph() {
            const svg = d3.select('#graph-canvas');
            svg.selectAll('*').remove();
            
            const width = svg.node().clientWidth;
            const height = svg.node().clientHeight;
            
            let filtered = topicsData;
            if (currentGrade !== 'all') {
                filtered = topicsData.filter(t => t.grade === parseInt(currentGrade));
            }
            
            const nodeIds = new Set(filtered.map(t => t.id));
            // d3.forceLink 认的是 link.source / link.target（不是 from / to），
            // 且每次重绘都要用新对象：它会把这两个字段改写成节点对象
            const links = dependenciesData
                .filter(d => d && nodeIds.has(d.from) && nodeIds.has(d.to))
                .map(d => ({ source: d.from, target: d.to, type: d.type }));
            
            const nodes = filtered.map(t => ({...t}));
            const nodeMap = new Map(nodes.map(n => [n.id, n]));
            
            const simulation = d3.forceSimulation(nodes)
                .force('link', d3.forceLink(links).id(d => d.id).distance(100))
                .force('charge', d3.forceManyBody().strength(-300))
                .force('center', d3.forceCenter(width / 2, height / 2))
                .force('x', d3.forceX(d => (d.grade - 1) * (width / 13)).strength(0.3));
            
            const link = svg.append('g')
                .selectAll('line')
                .data(links)
                .join('line')
                .attr('class', d => `link ${d.type}`);
            
            const node = svg.append('g')
                .selectAll('g')
                .data(nodes)
                .join('g')
                .attr('class', 'node')
                .call(d3.drag()
                    .on('start', dragstarted)
                    .on('drag', dragged)
                    .on('end', dragended));
            
            node.append('circle')
                .attr('r', 8)
                .attr('fill', d => getColor(d.grade))
                .on('click', (e, d) => showInfo(d));
            
            node.append('text')
                .attr('dx', 12)
                .attr('dy', 4)
                .text(d => d.name.length > 10 ? d.name.slice(0, 10) + '...' : d.name);
            
            simulation.on('tick', () => {
                link
                    .attr('x1', d => d.source.x)
                    .attr('y1', d => d.source.y)
                    .attr('x2', d => d.target.x)
                    .attr('y2', d => d.target.y);
                
                node.attr('transform', d => `translate(${d.x},${d.y})`);
            });
            
            function dragstarted(event, d) {
                if (!event.active) simulation.alphaTarget(0.3).restart();
                d.fx = d.x;
                d.fy = d.y;
            }
            
            function dragged(event, d) {
                d.fx = event.x;
                d.fy = event.y;
            }
            
            function dragended(event, d) {
                if (!event.active) simulation.alphaTarget(0);
                d.fx = null;
                d.fy = null;
            }
        }

        // 显示信息面板
        function showInfo(topic) {
            document.getElementById('info-title').textContent = topic.name;
            document.getElementById('info-meta').textContent = `${getGradeText(topic.grade)} | ${topic.chapter || ''}`;
            document.getElementById('info-desc').textContent = topic.description;
            document.getElementById('info-panel').classList.add('show');
        }

        function closeInfo() {
            document.getElementById('info-panel').classList.remove('show');
        }

        function focusTopic(topic) {
            showInfo(topic);
        }

        // 事件监听
        document.getElementById('subject-select').addEventListener('change', (e) => {
            currentSubject = e.target.value;
            loadData();
        });

        document.getElementById('grade-select').addEventListener('change', (e) => {
            currentGrade = e.target.value;
            updateTopicList();
            renderGraph();
        });

        (function syncSubjectSelect() {
            const sel = document.getElementById('subject-select');
            if (sel && [...sel.options].some(o => o.value === currentSubject)) sel.value = currentSubject;
        })();

        // 初始化
        loadData();
    </script>
    <script>
        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('../sw.js').catch(err => console.log('SW registration failed:', err));
        }
    </script>
</body>
</html>
