# k12 站点公共配置（被 nginx-k12.conf 的两个 server 块 include）
# 放在 /etc/nginx/ 下的 snippet 目录：/etc/nginx/snippets/k12-common.conf

root /var/www/k12;
index index.html;
charset utf-8;

# 目录地址补斜杠：/explore → /explore/
location ~ ^/(explore|diagnose|children)$ {
    return 301 $uri/;
}

location /assets/ {
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
}

# 数据文件短缓存：要频繁补题，长缓存会让"明明更新了还是旧题"
location /data/ {
    add_header Cache-Control "public, max-age=300, must-revalidate";
    try_files $uri =404;
}

# 阅读计数：由 scripts/novel_read_stats.py 在服务器上从 Nginx 日志增量生成
location /_counts/ {
    add_header Cache-Control "public, max-age=60";
    try_files $uri =404;
}

location = /sw.js {
    add_header Cache-Control "public, max-age=0, must-revalidate";
}

location ~* \.html$ {
    add_header Cache-Control "public, max-age=0, must-revalidate";
}

location / {
    try_files $uri $uri/ =404;
}

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

# PWA：让 manifest 以正确 MIME 返回（否则部分浏览器不认"添加到主屏幕"）
# ⛔ 不要写 `types { ... }` 块：server 级的 types 会**整体替换** http 级继承的
#    /etc/nginx/mime.types，结果是 .html/.css/.json 全变成 application/octet-stream，
#    浏览器直接下载而不是渲染（站点等于打不开）。用 location + default_type 只改这一条。
location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "public, max-age=3600";
}

access_log /var/log/nginx/k12.access.log;
error_log  /var/log/nginx/k12.error.log;
