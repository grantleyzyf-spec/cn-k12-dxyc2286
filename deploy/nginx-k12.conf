# 学科图谱站点 · Nginx 配置（xueketupu.com / www.xueketupu.com）
# 安装：
#   sudo mkdir -p /etc/nginx/snippets
#   sudo cp deploy/k12-common.conf /etc/nginx/snippets/k12-common.conf
#   sudo cp deploy/nginx-k12.conf   /etc/nginx/conf.d/k12.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# 三个 server 块的分工：
#   ① default_server（IP 直连）：**备案审核期**用，必须先能访问，别删
#   ② www → 主域 301
#   ③ 主域正式站

# ① IP 直连兜底（备案未通过时用 http://<服务器IP>/ 验收）
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    include /etc/nginx/snippets/k12-common.conf;
}

# ② www 301 到主域
server {
    listen 80;
    listen [::]:80;
    server_name www.xueketupu.com;
    return 301 http://xueketupu.com$request_uri;
}

# ③ 主域正式站
server {
    listen 80;
    listen [::]:80;
    server_name xueketupu.com;
    include /etc/nginx/snippets/k12-common.conf;
}

