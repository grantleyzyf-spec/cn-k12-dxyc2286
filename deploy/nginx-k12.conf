# 学科图谱站点 · Nginx 配置（xueketupu.com / www.xueketupu.com）
# 安装：
#   sudo mkdir -p /etc/nginx/snippets
#   sudo cp deploy/k12-common.conf /etc/nginx/snippets/k12-common.conf
#   sudo cp deploy/nginx-k12.conf   /etc/nginx/conf.d/k12.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# 四个 server 块的分工：
#   ① :80 default_server  任意 Host / IP 直连 → 301 到 https://xueketupu.com
#   ② :80 主域 + www      同上（保留 acme 校验路径供 certbot 续期）
#   ③ :443 主域           正式站
#   ④ :443 www            → 301 到裸域，避免两个域名各养一份收录
#
# ⚠️ ③④ 引用 /etc/letsencrypt/live/xueketupu.com/ 下的证书：
#    证书未签发前拷本文件会导致 nginx -t 失败 ⇒ 顺序必须是「先签证书，再 cp 本文件」。
#    一键脚本：sudo bash scripts/server-launch-domain.sh（见该脚本注释）

# ① 80 兜底（IP 直连 / 任意 Host）
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # certbot webroot 续期用，必须早于 301 命中
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/k12;
        default_type text/plain;
    }

    location / {
        return 301 https://xueketupu.com$request_uri;
    }
}

# ② 80 正式域名 → https
server {
    listen 80;
    listen [::]:80;
    server_name xueketupu.com www.xueketupu.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/k12;
        default_type text/plain;
    }

    location / {
        return 301 https://xueketupu.com$request_uri;
    }
}

# ③ 443 主域正式站
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name xueketupu.com;

    ssl_certificate     /etc/letsencrypt/live/xueketupu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xueketupu.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    include /etc/nginx/snippets/k12-common.conf;
}

# ④ 443 www → 裸域
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.xueketupu.com;

    ssl_certificate     /etc/letsencrypt/live/xueketupu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xueketupu.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://xueketupu.com$request_uri;
}
