# 站内客服（xueketupu.com）
# ① /api/chat 反代到本机 8091（SSE 必须关 buffering）
location /api/chat {
    proxy_pass http://127.0.0.1:8091;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}

# ② 全站自动注入挂件：不改 500+ 个 HTML，只在出口处追加两行
sub_filter_once on;
sub_filter_types text/html;
sub_filter '</body>' '<link rel="stylesheet" href="/assets/chat-widget.css?v=20261115b"><script src="/assets/chat-widget.js?v=20261115b" defer></script></body>';
