<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-12 知识图谱 - 自适应诊断</title>
    <link rel="manifest" href="../manifest.webmanifest">
    <meta name="theme-color" content="#667eea">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 { font-size: 28px; margin-bottom: 10px; }
        .header p { opacity: 0.9; font-size: 14px; }
        .content { padding: 30px; }
        .select-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        .select-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }
        .select-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        .select-group select:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .question-area {
            display: none;
            margin-top: 20px;
        }
        .question-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
        }
        .question-text {
            font-size: 18px;
            color: #333;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .option {
            padding: 15px 20px;
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .option:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }
        .option.selected {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }
        .progress {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        .progress-bar {
            flex: 1;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            margin: 0 15px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s;
        }
        .result-area {
            display: none;
            margin-top: 20px;
        }
        .result-card {
            background: linear-gradient(135deg, #667eea15 0%, #764ba215 100%);
            border: 2px solid #667eea;
            border-radius: 12px;
            padding: 25px;
        }
        .result-title {
            font-size: 20px;
            font-weight: 600;
            color: #667eea;
            margin-bottom: 15px;
        }
        .result-list {
            list-style: none;
        }
        .result-list li {
            padding: 10px 0;
            border-bottom: 1px solid #e0e0e0;
        }
        .result-list li:last-child { border-bottom: none; }
        .result-list .topic-name { font-weight: 600; color: #333; }
        .result-list .topic-desc { font-size: 14px; color: #666; margin-top: 5px; }
        .warning {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            font-size: 13px;
            color: #856404;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 自适应学习诊断</h1>
            <p>选择目标知识点，系统将自动检测你的前置知识掌握情况</p>
        </div>
        <div class="content">
            <a href="../" style="display:inline-block;margin-bottom:20px;color:#667eea;text-decoration:none;">← 返回首页</a>
            <div id="setup-area">
                <div class="select-group">
                    <div>
                        <label>学科</label>
                        <select id="subject-select">
                            <option value="">请选择学科</option>
                            <option value="math">📐 数学</option>
                            <option value="chinese">📖 语文</option>
                            <option value="english">🔤 英语</option>
                            <option value="physics">⚡ 物理</option>
                            <option value="chemistry">🧪 化学</option>
                            <option value="biology">🧬 生物</option>
                            <option value="history">📜 历史</option>
                            <option value="geography">🌍 地理</option>
                            <option value="science">🔬 科学</option>
                            <option value="information-technology">💻 信息科技</option>
                            <option value="japanese">🇯🇵 日语</option>
                            <option value="russian">🇷🇺 俄语</option>
                            <option value="german">🇩🇪 德语</option>
                            <option value="french">🇫🇷 法语</option>
                            <option value="spanish">🇪🇸 西班牙语</option>
                            <option value="music">🎵 音乐</option>
                            <option value="art">🎨 美术</option>
                        </select>
                    </div>
                    <div>
                        <label>目标知识点</label>
                        <select id="topic-select" disabled>
                            <option value="">请先选择学科</option>
                        </select>
                    </div>
                </div>
                <button class="btn" id="start-btn" disabled>开始诊断</button>
            </div>

            <div class="question-area" id="question-area">
                <div class="progress">
                    <span id="progress-text">第 1 题</span>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
                    </div>
                    <span id="progress-total">共 0 题</span>
                </div>
                <div class="question-card">
                    <div class="question-text" id="question-text"></div>
                    <div class="options" id="options"></div>
                </div>
                <button class="btn" id="next-btn">下一题</button>
            </div>

            <div class="result-area" id="result-area">
                <div class="result-card">
                    <div class="result-title">📊 诊断结果</div>
                    <div id="result-content"></div>
                </div>
                <div class="warning">
                    ⚠️ <strong>声明：</strong>本诊断工具基于 AI 生成的初稿数据，未经教师审核。结果仅供参考，不能替代专业教学评估。
                </div>
                <button class="btn" style="margin-top: 20px;" onclick="location.reload()">重新诊断</button>
            </div>
        </div>
    </div>

    <script src="../assets/children.js"></script>
    <script>
        // 数据加载
        let topicsData = {};
        let questionsData = {};
        let dependenciesData = {};

        // 状态
        let currentSubject = '';
        let targetTopic = null;
        let questionQueue = [];
        let currentQuestionIndex = 0;
        let answers = {};
        let weakTopics = [];

        // 学科名称映射
        const subjectNames = {
            'math': '数学', 'chinese': '语文', 'english': '英语',
            'physics': '物理', 'chemistry': '化学', 'biology': '生物',
            'history': '历史', 'geography': '地理', 'science': '科学',
            'information-technology': '信息科技', 'japanese': '日语',
            'russian': '俄语', 'german': '德语', 'french': '法语',
            'spanish': '西班牙语', 'music': '音乐', 'art': '美术'
        };

        // 获取学科的topics文件列表
        function getTopicsFiles(subject) {
            // v2：topics.json 已含全部学段（grade 拆分文件仅作归档，不再叠加，避免重复）
            return ['topics.json'];
        }

        // 获取学科的dependencies文件列表
        function getDepsFiles(subject) {
            return ['dependencies.json'];
        }

        // 获取学科的questions文件列表
        function getQuestionsFiles(subject) {
            return ['questions.json'];
        }

        // 初始化
        document.getElementById('subject-select').addEventListener('change', loadTopics);
        document.getElementById('start-btn').addEventListener('click', startDiagnosis);
        document.getElementById('next-btn').addEventListener('click', nextQuestion);

        // 加载知识点列表
        async function loadTopics() {
            const subject = document.getElementById('subject-select').value;
            if (!subject) return;

            currentSubject = subject;
            const topicSelect = document.getElementById('topic-select');
            topicSelect.innerHTML = '<option value="">加载中...</option>';
            topicSelect.disabled = true;

            try {
                // 加载所有topics文件
                const files = getTopicsFiles(subject);
                let allTopics = [];
                for (const file of files) {
                    const response = await fetch(`../data/${subject}/${file}`);
                    if (response.ok) {
                        const data = await response.json();
                        allTopics = allTopics.concat(data);
                    }
                }
                topicsData = Array.from(new Map(allTopics.map(t => [t.id, t])).values());
                
                topicSelect.innerHTML = '<option value="">请选择目标知识点</option>';
                topicsData.sort((a, b) => (a.grade || 0) - (b.grade || 0));
                topicsData.forEach(topic => {
                    const option = document.createElement('option');
                    option.value = topic.id;
                    option.textContent = `${topic.name} (${getGradeText(topic.grade)})`;
                    topicSelect.appendChild(option);
                });
                topicSelect.disabled = false;
                
                topicSelect.addEventListener('change', () => {
                    document.getElementById('start-btn').disabled = !topicSelect.value;
                });
            } catch (e) {
                topicSelect.innerHTML = '<option value="">数据加载失败</option>';
                console.error('加载知识点失败:', e);
            }
        }

        // 获取年级文本
        function getGradeText(grade) {
            if (grade <= 6) return `${grade}年级`;
            if (grade <= 9) return `${grade - 6}年级(初中)`;
            if (grade <= 12) return `高一${grade - 10 > 0 ? '+' + (grade - 10) : ''}`;
            return `选必${grade - 12}`;
        }

        // 开始诊断
        async function startDiagnosis() {
            const topicId = document.getElementById('topic-select').value;
            targetTopic = topicsData.find(t => t.id === topicId);
            
            if (!targetTopic) return;

            // 加载题库和依赖关系（支持多文件）
            try {
                const depsFiles = getDepsFiles(currentSubject);
                const qFiles = getQuestionsFiles(currentSubject);
                
                let allDeps = [];
                for (const file of depsFiles) {
                    const response = await fetch(`../data/${currentSubject}/${file}`);
                    if (response.ok) {
                        const data = await response.json();
                        allDeps = allDeps.concat(data);
                    }
                }
                dependenciesData = Array.from(new Map(allDeps.map(d => [`${d.from}->${d.to}:${d.type}`, d])).values());
                
                let allQuestions = [];
                for (const file of qFiles) {
                    const response = await fetch(`../data/${currentSubject}/${file}`);
                    if (response.ok) {
                        const data = await response.json();
                        allQuestions = allQuestions.concat(data);
                    }
                }
                questionsData = Array.from(new Map(allQuestions.map(q => [q.id, q])).values());
            } catch (e) {
                alert('数据加载失败，请刷新重试');
                return;
            }

            // 构建诊断路径（从目标知识点向上追溯先修）
            questionQueue = buildDiagnosisPath(targetTopic);
            currentQuestionIndex = 0;
            answers = {};
            weakTopics = [];

            document.getElementById('setup-area').style.display = 'none';
            document.getElementById('question-area').style.display = 'block';
            document.getElementById('progress-total').textContent = `共 ${questionQueue.length} 题`;
            
            showQuestion();
        }

        // 构建诊断路径
        function buildDiagnosisPath(topic) {
            const path = [];
            const visited = new Set();
            
            function traverse(t) {
                if (visited.has(t.id)) return;
                visited.add(t.id);
                
                // 先递归处理先修知识点
                const deps = dependenciesData.filter(d => d.to === t.id && d.type === 'hard');
                deps.forEach(dep => {
                    const prereq = topicsData.find(tp => tp.id === dep.from);
                    if (prereq) traverse(prereq);
                });
                
                // 再添加当前知识点的题目
                const questions = questionsData.filter(q => q.topicId === t.id);
                if (questions.length > 0) {
                    path.push({ topic: t, question: questions[0] });
                }
            }
            
            traverse(topic);
            return path;
        }

        // 显示题目
        function showQuestion() {
            if (currentQuestionIndex >= questionQueue.length) {
                showResult();
                return;
            }

            const item = questionQueue[currentQuestionIndex];
            document.getElementById('question-text').textContent = (item.question.prompt || item.question.question);
            document.getElementById('progress-text').textContent = `第 ${currentQuestionIndex + 1} 题`;
            document.getElementById('progress-fill').style.width = `${(currentQuestionIndex / questionQueue.length) * 100}%`;

            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = '';
            
            if ((item.question.options || []) && (item.question.options || []).length > 0) {
                (item.question.options || []).forEach(opt => {
                    const div = document.createElement('div');
                    div.className = 'option';
                    div.textContent = `${opt.label}. ${opt.text}`;
                    div.onclick = () => selectOption(div, opt.label);
                    optionsDiv.appendChild(div);
                });
            }
        }

        // 选择选项
        function selectOption(element, label) {
            document.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
            element.classList.add('selected');
            answers[currentQuestionIndex] = label;
        }

        // 下一题
        function nextQuestion() {
            const item = questionQueue[currentQuestionIndex];
            const userAnswer = answers[currentQuestionIndex];
            
            // 检查答案
            if (userAnswer !== item.question.answer) {
                weakTopics.push(item.topic);
            }
            
            currentQuestionIndex++;
            showQuestion();
        }

        // 显示结果
        function showResult() {
            document.getElementById('question-area').style.display = 'none';
            document.getElementById('result-area').style.display = 'block';
            
            const content = document.getElementById('result-content');
            
            if (weakTopics.length === 0) {
                content.innerHTML = `
                    <p style="color: #28a745; font-size: 16px;">
                        ✅ 太棒了！你的前置知识掌握得很好，可以开始学习「${targetTopic.name}」了！
                    </p>
                `;
            } else {
                content.innerHTML = `
                    <p style="margin-bottom: 15px;">
                        建议先复习以下 <strong>${weakTopics.length}</strong> 个知识点：
                    </p>
                    <ul class="result-list">
                        ${weakTopics.map(t => `
                            <li>
                                <div class="topic-name">📌 ${t.name}</div>
                                <div class="topic-desc">${t.description}</div>
                            </li>
                        `).join('')}
                    </ul>
                `;
            }

            // 存入学习档案（无档案时按匿名记录保存）
            try {
                if (window.CnmKids) {
                    var kid = window.CnmKids.current();
                    window.CnmKids.addRecord({
                        subject: currentSubject,
                        target: targetTopic ? { id: targetTopic.id, name: targetTopic.name } : null,
                        asked: questionQueue.length,
                        weak: weakTopics.map(function (t) { return { id: t.id, name: t.name }; })
                    });
                    var tip = document.createElement('p');
                    tip.style.cssText = 'margin-top:12px;font-size:14px;color:#6b7280';
                    tip.innerHTML = kid
                        ? '已存入「' + kid.name + '」的档案 · <a href="../children/history.html?child=' + encodeURIComponent(kid.id) + '">查看记录</a>'
                        : '尚未建档，本次结果未保存 · <a href="../children/">去建档</a>';
                    content.appendChild(tip);
                }
            } catch (e) { console.warn('保存诊断记录失败', e); }
        }
    </script>
    <script>
        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('../sw.js').catch(err => console.log('SW registration failed:', err));
        }
    </script>
</body>
</html>
