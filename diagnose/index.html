<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-12 知识图谱 - 自适应诊断</title>
    <link rel="manifest" href="../manifest.webmanifest">
    <meta name="theme-color" content="#0f6e62">
    <link rel="stylesheet" href="../assets/site.css">
    <style>
        /* 页面级布局：颜色与组件来自 ../assets/site.css */
        body { background: var(--bg); }
        main.diag { max-width: 860px; margin: 0 auto; padding: 26px 18px 64px; }

        .page-head { margin: 4px 0 22px; }
        .page-head h1 { margin: 0 0 6px; font-size: clamp(24px, 4vw, 32px); letter-spacing: -.01em; }
        .page-head p { margin: 0; color: var(--ink-2); font-size: 15px; }

        .panel {
            background: var(--card); border: 1px solid var(--line);
            border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px;
        }
        .select-group {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 14px; margin-bottom: 18px;
        }
        .select-group label { display: block; font-weight: 650; font-size: 13.5px; margin-bottom: 7px; color: var(--ink); }
        .select-group select {
            width: 100%; min-height: 44px; padding: 0 12px; font-size: 14.5px;
            color: var(--ink); background: var(--card);
            border: 1px solid var(--line); border-radius: var(--radius-sm);
        }
        .select-group select:focus { outline: 2px solid var(--brand); outline-offset: 1px; }

        .btn {
            display: block; width: 100%; min-height: 46px; padding: 0 18px;
            background: var(--brand); color: #fff; border: 1px solid var(--brand);
            border-radius: var(--radius-sm); font-size: 15.5px; font-weight: 650;
            cursor: pointer;
        }
        .btn:hover { background: var(--brand-ink); border-color: var(--brand-ink); }
        .btn:disabled { opacity: .55; cursor: not-allowed; }

        .question-area, .result-area { display: none; margin-top: 18px; }
        .question-card {
            background: var(--bg); border: 1px solid var(--line);
            border-radius: var(--radius); padding: 18px; margin-bottom: 16px;
        }
        .question-text { font-size: 17px; line-height: 1.65; color: var(--ink); margin-bottom: 16px; }
        .options { display: flex; flex-direction: column; gap: 10px; }
        .option {
            padding: 13px 16px; min-height: 46px; display: flex; align-items: center;
            background: var(--card); border: 1px solid var(--line);
            border-radius: var(--radius-sm); cursor: pointer; font-size: 14.5px;
        }
        .option:hover { border-color: var(--brand); background: var(--brand-soft); }
        .option.selected { border-color: var(--brand); background: var(--brand); color: #fff; }

        .progress {
            display: flex; align-items: center; gap: 12px; margin-bottom: 16px;
            padding: 10px 14px; background: var(--card);
            border: 1px solid var(--line); border-radius: var(--radius-sm);
            font-size: 13px; color: var(--ink-2);
        }
        .progress-bar { flex: 1; height: 7px; background: var(--line); border-radius: 99px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--brand); width: 0; transition: width .3s; }

        .result-card {
            background: var(--card); border: 1px solid var(--brand);
            border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow);
        }
        .result-title { font-size: 18px; font-weight: 700; color: var(--brand-ink); margin-bottom: 12px; }
        .result-list { list-style: none; margin: 0; padding: 0; }
        .result-list li { padding: 10px 0; border-bottom: 1px solid var(--line); }
        .result-list li:last-child { border-bottom: 0; }
        .result-list .topic-name { font-weight: 650; color: var(--ink); }
        .result-list .topic-desc { font-size: 13.5px; color: var(--ink-2); margin-top: 4px; }

        .warning {
            margin-top: 16px; padding: 12px 14px; font-size: 13px;
            background: var(--brand-soft); color: var(--brand-ink);
            border: 1px solid color-mix(in srgb, var(--brand) 30%, transparent);
            border-radius: var(--radius-sm);
        }
    </style>
</head>
<body>
<header class="site-header">
  <a class="brand" href="../">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
      <circle cx="7" cy="7" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <circle cx="25" cy="7" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <circle cx="7" cy="25" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <circle cx="25" cy="25" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <path d="M10.2 7h11.6M7 10.2v11.6M25 10.2v11.6M10.2 25h11.6" stroke="currentColor" stroke-width="1.5"/>
    </svg>
    <span class="brand-copy">
      <span class="brand-name">中国 K-12 知识图谱</span>
      <span class="brand-kicker">自适应诊断</span>
    </span>
  </a>
  <nav class="site-nav" aria-label="主导航">
    <a class="nav-link" href="../">首页</a>
    <a class="nav-link " href="./">知识图谱</a>
    <a class="nav-link active" href="../diagnose/">诊断</a>
    <a class="nav-link" href="../children/">档案</a>
    <a class="nav-link" href="https://github.com/grantleyzyf-spec/cn-k12-dxyc2286" target="_blank" rel="noopener noreferrer">关于</a>
  </nav>
</header>
<main class="diag">
    <div class="page-head">
        <h1>自适应诊断</h1>
        <p>选一个目标知识点，系统沿必先修关系逐层出题，找出真正卡住的那一步。</p>
    </div>
    <div class="panel">
                        <div id="setup-area">
                <div class="select-group">
                    <div>
                        <label>学科</label>
                        <select id="subject-select">
                            <option value="">请选择学科</option>
                            <option value="math">📐 数学</option>
                            <option value="chinese">📖 语文</option>
                            <option value="english">🔤 英语</option>
                            <option value="physics">⚡ 物理</option>
                            <option value="chemistry">🧪 化学</option>
                            <option value="biology">🧬 生物</option>
                            <option value="history">📜 历史</option>
                            <option value="geography">🌍 地理</option>
                            <option value="science">🔬 科学</option>
                            <option value="information-technology">💻 信息科技</option>
                            <option value="japanese">🇯🇵 日语</option>
                            <option value="russian">🇷🇺 俄语</option>
                            <option value="german">🇩🇪 德语</option>
                            <option value="french">🇫🇷 法语</option>
                            <option value="spanish">🇪🇸 西班牙语</option>
                            <option value="music">🎵 音乐</option>
                            <option value="art">🎨 美术</option>
                        </select>
                    </div>
                    <div>
                        <label>目标知识点</label>
                        <select id="topic-select" disabled>
                            <option value="">请先选择学科</option>
                        </select>
                    </div>
                </div>
                <button class="btn" id="start-btn" disabled>开始诊断</button>
            </div>

            <div class="question-area" id="question-area">
                <div class="progress">
                    <span id="progress-text">第 1 题</span>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
                    </div>
                    <span id="progress-total">共 0 题</span>
                </div>
                <div class="question-card">
                    <div class="question-text" id="question-text"></div>
                    <div class="options" id="options"></div>
                </div>
                <button class="btn" id="next-btn">下一题</button>
            </div>

            <div class="result-area" id="result-area">
                <div class="result-card">
                    <div class="result-title">📊 诊断结果</div>
                    <div id="result-content"></div>
                </div>
                <div class="warning">
                    ⚠️ <strong>声明：</strong>本诊断工具基于 AI 生成的初稿数据，未经教师审核。结果仅供参考，不能替代专业教学评估。
                </div>
                <button class="btn" style="margin-top: 20px;" onclick="location.reload()">重新诊断</button>
            </div>
    </div>
</main>

    <script src="../assets/children.js"></script>
    <script>
        // 数据加载
        let topicsData = {};
        let questionsData = {};
        let dependenciesData = {};

        // 状态
        let currentSubject = new URLSearchParams(location.search).get('subject') || '';
        let targetTopic = null;
        let questionQueue = [];
        let currentQuestionIndex = 0;
        let answers = {};
        let weakTopics = [];

        // 学科名称映射
        const subjectNames = {
            'math': '数学', 'chinese': '语文', 'english': '英语',
            'physics': '物理', 'chemistry': '化学', 'biology': '生物',
            'history': '历史', 'geography': '地理', 'science': '科学',
            'information-technology': '信息科技', 'japanese': '日语',
            'russian': '俄语', 'german': '德语', 'french': '法语',
            'spanish': '西班牙语', 'music': '音乐', 'art': '美术'
        };

        // 获取学科的topics文件列表
        function getTopicsFiles(subject) {
            // v2：topics.json 已含全部学段（grade 拆分文件仅作归档，不再叠加，避免重复）
            return ['topics.json'];
        }

        // 获取学科的dependencies文件列表
        function getDepsFiles(subject) {
            return ['dependencies.json'];
        }

        // 获取学科的questions文件列表
        function getQuestionsFiles(subject) {
            return ['questions.json'];
        }

        // 初始化
        document.getElementById('subject-select').addEventListener('change', loadTopics);
        document.getElementById('start-btn').addEventListener('click', startDiagnosis);
        document.getElementById('next-btn').addEventListener('click', nextQuestion);

        // URL 参数 ?topic= 预选知识点（从知识图谱「诊断这个知识点」进来）
        const topicParam = new URLSearchParams(location.search).get('topic') || '';

        // URL 参数 ?subject= 初始化（学科下拉同步并加载知识点）
        (function initSubjectFromUrl() {
            const sel = document.getElementById('subject-select');
            if (!currentSubject) return;
            if ([...sel.options].some(o => o.value === currentSubject)) {
                sel.value = currentSubject;
                loadTopics();
            }
        })();

        // 加载知识点列表
        async function loadTopics() {
            const subject = document.getElementById('subject-select').value;
            if (!subject) return;

            currentSubject = subject;
            const topicSelect = document.getElementById('topic-select');
            topicSelect.innerHTML = '<option value="">加载中...</option>';
            topicSelect.disabled = true;

            try {
                // 加载所有topics文件
                const files = getTopicsFiles(subject);
                let allTopics = [];
                for (const file of files) {
                    const response = await fetch(`../data/${subject}/${file}`);
                    if (response.ok) {
                        const data = await response.json();
                        allTopics = allTopics.concat(data);
                    }
                }
                topicsData = Array.from(new Map(allTopics.map(t => [t.id, t])).values());
                
                topicSelect.innerHTML = '<option value="">请选择目标知识点</option>';
                topicsData.sort((a, b) => (a.grade || 0) - (b.grade || 0));
                topicsData.forEach(topic => {
                    const option = document.createElement('option');
                    option.value = topic.id;
                    option.textContent = `${topic.name} (${getGradeText(topic.grade)})`;
                    topicSelect.appendChild(option);
                });
                topicSelect.disabled = false;
                
                topicSelect.addEventListener('change', () => {
                    document.getElementById('start-btn').disabled = !topicSelect.value;
                });

                // 从知识图谱「诊断这个知识点」进来时预选该点
                if (topicParam && [...topicSelect.options].some(o => o.value === topicParam)) {
                    topicSelect.value = topicParam;
                    document.getElementById('start-btn').disabled = false;
                }
            } catch (e) {
                topicSelect.innerHTML = '<option value="">数据加载失败</option>';
                console.error('加载知识点失败:', e);
            }
        }

        // 获取年级文本
        function getGradeText(grade) {
            // 1–9 年级用「X年级」；10–14 是高中册次（必修一/二、选必一/二/三），不写「十三年级」
            const CN = ['', '一', '二', '三', '四', '五', '六', '七', '八', '九'];
            const BOOK = { 10: '必修一', 11: '必修二', 12: '选必一', 13: '选必二', 14: '选必三' };
            const g = Number(grade);
            if (BOOK[g]) return BOOK[g];
            return (CN[g] || g) + '年级';
        }

        // 开始诊断
        async function startDiagnosis() {
            const topicId = document.getElementById('topic-select').value;
            targetTopic = topicsData.find(t => t.id === topicId);
            
            if (!targetTopic) return;

            // 加载题库和依赖关系（支持多文件）
            try {
                const depsFiles = getDepsFiles(currentSubject);
                const qFiles = getQuestionsFiles(currentSubject);
                
                let allDeps = [];
                for (const file of depsFiles) {
                    const response = await fetch(`../data/${currentSubject}/${file}`);
                    if (response.ok) {
                        const data = await response.json();
                        allDeps = allDeps.concat(data);
                    }
                }
                dependenciesData = Array.from(new Map(allDeps.map(d => [`${d.from}->${d.to}:${d.type}`, d])).values());
                
                let allQuestions = [];
                for (const file of qFiles) {
                    const response = await fetch(`../data/${currentSubject}/${file}`);
                    if (response.ok) {
                        const data = await response.json();
                        allQuestions = allQuestions.concat(data);
                    }
                }
                questionsData = Array.from(new Map(allQuestions.map(q => [q.id, q])).values());
            } catch (e) {
                alert('数据加载失败，请刷新重试');
                return;
            }

            // 构建诊断路径（从目标知识点向上追溯先修）
            questionQueue = buildDiagnosisPath(targetTopic);
            currentQuestionIndex = 0;
            answers = {};
            weakTopics = [];

            document.getElementById('setup-area').style.display = 'none';
            document.getElementById('question-area').style.display = 'block';
            document.getElementById('progress-total').textContent = `共 ${questionQueue.length} 题`;
            
            showQuestion();
        }

        // 构建诊断路径
        function buildDiagnosisPath(topic) {
            const path = [];
            const visited = new Set();
            
            function traverse(t) {
                if (visited.has(t.id)) return;
                visited.add(t.id);
                
                // 先递归处理先修知识点
                const deps = dependenciesData.filter(d => d.to === t.id && d.type === 'hard');
                deps.forEach(dep => {
                    const prereq = topicsData.find(tp => tp.id === dep.from);
                    if (prereq) traverse(prereq);
                });
                
                // 再添加当前知识点的题目
                const questions = questionsData.filter(q => q.topicId === t.id);
                if (questions.length > 0) {
                    path.push({ topic: t, question: questions[0] });
                }
            }
            
            traverse(topic);
            return path;
        }

        // 显示题目
        function showQuestion() {
            if (currentQuestionIndex >= questionQueue.length) {
                showResult();
                return;
            }

            const item = questionQueue[currentQuestionIndex];
            document.getElementById('question-text').textContent = (item.question.prompt || item.question.question);
            document.getElementById('progress-text').textContent = `第 ${currentQuestionIndex + 1} 题`;
            document.getElementById('progress-fill').style.width = `${(currentQuestionIndex / questionQueue.length) * 100}%`;

            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = '';
            
            if ((item.question.options || []) && (item.question.options || []).length > 0) {
                (item.question.options || []).forEach(opt => {
                    const div = document.createElement('div');
                    div.className = 'option';
                    div.textContent = `${opt.label}. ${opt.text}`;
                    div.onclick = () => selectOption(div, opt.label);
                    optionsDiv.appendChild(div);
                });
            }
        }

        // 选择选项
        function selectOption(element, label) {
            document.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
            element.classList.add('selected');
            answers[currentQuestionIndex] = label;
        }

        // 下一题
        function nextQuestion() {
            const item = questionQueue[currentQuestionIndex];
            const userAnswer = answers[currentQuestionIndex];
            
            // 检查答案
            if (userAnswer !== item.question.answer) {
                weakTopics.push(item.topic);
            }
            
            currentQuestionIndex++;
            showQuestion();
        }

        // 显示结果
        function showResult() {
            document.getElementById('question-area').style.display = 'none';
            document.getElementById('result-area').style.display = 'block';
            
            const content = document.getElementById('result-content');
            
            if (weakTopics.length === 0) {
                content.innerHTML = `
                    <p style="color: #28a745; font-size: 16px;">
                        ✅ 太棒了！你的前置知识掌握得很好，可以开始学习「${targetTopic.name}」了！
                    </p>
                `;
            } else {
                content.innerHTML = `
                    <p style="margin-bottom: 15px;">
                        建议先复习以下 <strong>${weakTopics.length}</strong> 个知识点：
                    </p>
                    <ul class="result-list">
                        ${weakTopics.map(t => `
                            <li>
                                <div class="topic-name">📌 ${t.name}</div>
                                <div class="topic-desc">${t.description}</div>
                            </li>
                        `).join('')}
                    </ul>
                `;
            }

            // 存入学习档案（无档案时按匿名记录保存）
            try {
                if (window.CnmKids) {
                    var kid = window.CnmKids.current();
                    window.CnmKids.addRecord({
                        subject: currentSubject,
                        target: targetTopic ? { id: targetTopic.id, name: targetTopic.name } : null,
                        asked: questionQueue.length,
                        weak: weakTopics.map(function (t) { return { id: t.id, name: t.name }; })
                    });
                    var tip = document.createElement('p');
                    tip.style.cssText = 'margin-top:12px;font-size:14px;color:#6b7280';
                    tip.innerHTML = kid
                        ? '已存入「' + kid.name + '」的档案 · <a href="../children/history.html?child=' + encodeURIComponent(kid.id) + '">查看记录</a>'
                        : '尚未建档，本次结果未保存 · <a href="../children/">去建档</a>';
                    content.appendChild(tip);
                }
            } catch (e) { console.warn('保存诊断记录失败', e); }
        }
    </script>
    <script>
        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('../sw.js').catch(err => console.log('SW registration failed:', err));
        }
    </script>
</body>
</html>
