<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-12 知识图谱 - 自适应诊断</title>
    <link rel="manifest" href="../manifest.webmanifest">
    <meta name="theme-color" content="#0f6e62">
    <link rel="stylesheet" href="../assets/site.css">
    <style>
        /* 页面级布局：颜色与组件来自 ../assets/site.css */
        body { background: var(--bg); }
        main.diag { max-width: 860px; margin: 0 auto; padding: 26px 18px 64px; }

        .page-head { margin: 4px 0 22px; }
        .page-head h1 { margin: 0 0 6px; font-size: clamp(24px, 4vw, 32px); letter-spacing: -.01em; }
        .page-head p { margin: 0; color: var(--ink-2); font-size: 15px; }

        .panel {
            background: var(--card); border: 1px solid var(--line);
            border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px;
        }
        .select-group {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 14px; margin-bottom: 18px;
        }
        .select-group label { display: block; font-weight: 650; font-size: 13.5px; margin-bottom: 7px; color: var(--ink); }
        .select-group select {
            width: 100%; min-height: 44px; padding: 0 12px; font-size: 14.5px;
            color: var(--ink); background: var(--card);
            border: 1px solid var(--line); border-radius: var(--radius-sm);
        }
        .select-group select:focus { outline: 2px solid var(--brand); outline-offset: 1px; }

        .btn {
            display: block; width: 100%; min-height: 46px; padding: 0 18px;
            background: var(--brand); color: #fff; border: 1px solid var(--brand);
            border-radius: var(--radius-sm); font-size: 15.5px; font-weight: 650;
            cursor: pointer;
        }
        .btn:hover { background: var(--brand-ink); border-color: var(--brand-ink); }
        .btn:disabled { opacity: .55; cursor: not-allowed; }

        .question-area, .result-area { display: none; margin-top: 18px; }
        .question-card {
            background: var(--bg); border: 1px solid var(--line);
            border-radius: var(--radius); padding: 18px; margin-bottom: 16px;
        }
        .question-text { font-size: 17px; line-height: 1.65; color: var(--ink); margin-bottom: 16px; }
        .options { display: flex; flex-direction: column; gap: 10px; }
        .option {
            padding: 13px 16px; min-height: 46px; display: flex; align-items: center;
            background: var(--card); border: 1px solid var(--line);
            border-radius: var(--radius-sm); cursor: pointer; font-size: 14.5px;
        }
        .option:hover { border-color: var(--brand); background: var(--brand-soft); }
        .option.selected { border-color: var(--brand); background: var(--brand); color: #fff; }

        .answer-input { margin-top: 14px; }
        .answer-input input, .answer-input textarea {
            width: 100%; box-sizing: border-box; padding: 12px 14px; font-size: 15px;
            color: var(--ink); background: var(--card); border: 1px solid var(--line);
            border-radius: var(--radius-sm); font-family: inherit; resize: vertical;
        }
        .answer-input input:focus, .answer-input textarea:focus { outline: none; border-color: var(--brand); }
        .feedback { margin-top: 14px; font-size: 14px; line-height: 1.7; }
        .feedback .fb-ok { color: #15803d; font-weight: 600; }
        .feedback .fb-no { color: #b91c1c; font-weight: 600; }
        .feedback .fb-box {
            margin-top: 8px; padding: 12px 14px; background: var(--card);
            border: 1px solid var(--line); border-left: 3px solid var(--brand);
            border-radius: var(--radius-sm); color: var(--ink-2);
        }
        .feedback .fb-key { margin: 6px 0 0; padding-left: 18px; }
        .self-hint { margin: 10px 0 6px; font-size: 14px; color: #444; }
        .self-check { display: flex; gap: 10px; margin-top: 10px; }
        .self-check button {
            flex: 1; padding: 10px; font-size: 14px; cursor: pointer; font-family: inherit;
            background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-sm); color: var(--ink);
        }
        .self-check button.yes { border-color: #15803d; color: #15803d; }
        .self-check button.no { border-color: #b91c1c; color: #b91c1c; }

        .progress {
            display: flex; align-items: center; gap: 12px; margin-bottom: 16px;
            padding: 10px 14px; background: var(--card);
            border: 1px solid var(--line); border-radius: var(--radius-sm);
            font-size: 13px; color: var(--ink-2);
        }
        .progress-bar { flex: 1; height: 7px; background: var(--line); border-radius: 99px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--brand); width: 0; transition: width .3s; }

        .result-card {
            background: var(--card); border: 1px solid var(--brand);
            border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow);
        }
        .result-title { font-size: 18px; font-weight: 700; color: var(--brand-ink); margin-bottom: 12px; }
        .result-list { list-style: none; margin: 0; padding: 0; }
        .result-list li { padding: 10px 0; border-bottom: 1px solid var(--line); }
        .result-list li:last-child { border-bottom: 0; }
        .result-list .topic-name { font-weight: 650; color: var(--ink); }
        .result-list .topic-desc { font-size: 13.5px; color: var(--ink-2); margin-top: 4px; }

        .warning {
            margin-top: 16px; padding: 12px 14px; font-size: 13px;
            background: var(--brand-soft); color: var(--brand-ink);
            border: 1px solid color-mix(in srgb, var(--brand) 30%, transparent);
            border-radius: var(--radius-sm);
        }

        /* ---------- 整卷模式 ---------- */
        .mode-tabs { display: flex; gap: 8px; margin: 0 0 18px; flex-wrap: wrap; }
        .mode-tab {
            padding: 10px 16px; font-size: 14.5px; font-weight: 650; cursor: pointer;
            background: var(--card); color: var(--ink-2);
            border: 1px solid var(--line); border-radius: 99px; font-family: inherit;
        }
        .mode-tab.active { background: var(--brand); border-color: var(--brand); color: #fff; }
        .mode-tab small { font-weight: 400; opacity: .8; margin-left: 4px; }

        .ex-head { border-bottom: 1px solid var(--line); padding-bottom: 14px; margin-bottom: 18px; }
        .ex-title { font-size: 20px; font-weight: 750; color: var(--ink); }
        .ex-edition {
            display: inline-block; margin-right: 8px; padding: 2px 8px; vertical-align: 2px;
            font-size: 12.5px; font-weight: 700; color: #fff; background: var(--brand-ink);
            border-radius: 5px; letter-spacing: .02em;
        }
        .ex-sub { margin-top: 6px; font-size: 13.5px; color: var(--ink-2); }
        .ex-scope { margin-top: 6px; font-size: 13px; color: var(--ink-2); }
        .ex-timer {
            margin-top: 10px; display: inline-block; padding: 6px 12px; font-size: 14px; font-weight: 700;
            color: var(--brand-ink); background: var(--brand-soft); border-radius: 99px;
            border: 1px solid color-mix(in srgb, var(--brand) 25%, transparent);
        }
        .ex-timer.warn { color: #b91c1c; background: #fef2f2; border-color: #fecaca; }

        .ex-section { margin-bottom: 22px; }
        .ex-sec-title { font-size: 16px; font-weight: 700; color: var(--brand-ink); margin-bottom: 4px; }
        .ex-sec-rule { font-size: 13px; color: var(--ink-2); margin-bottom: 12px; }
        .ex-item { background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 12px; }
        .ex-item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
        .ex-no { font-weight: 700; color: var(--ink); }
        .ex-badge { font-size: 12px; color: var(--brand-ink); background: var(--brand-soft); border-radius: 4px; padding: 1px 6px; }
        .ex-score { font-size: 12px; color: var(--ink-2); margin-left: auto; }
        .ex-stem { font-size: 15.5px; line-height: 1.7; color: var(--ink); white-space: pre-wrap; }
        .ex-tip { font-size: 12.5px; color: var(--ink-2); margin-top: 8px; }
        .ex-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        .ex-btn-ghost {
            width: 100%; min-height: 44px; background: var(--card); color: var(--ink);
            border: 1px solid var(--line); border-radius: var(--radius-sm); font-size: 14.5px;
            font-family: inherit; cursor: pointer;
        }
        .ex-btn-ghost:hover { border-color: var(--brand); color: var(--brand-ink); }

        .ex-kpi { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin: 6px 0 4px; }
        .ex-kpi > div { background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px; text-align: center; }
        .ex-kpi b { display: block; font-size: 22px; color: var(--brand-ink); }
        .ex-kpi span { font-size: 12px; color: var(--ink-2); }
        .ex-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
        .ex-table th, .ex-table td { border-bottom: 1px solid var(--line); padding: 8px 6px; text-align: left; }
        .ex-rate { font-size: 12px; color: #b91c1c; background: #fef2f2; border-radius: 99px; padding: 1px 7px; margin-left: 6px; }
        .ex-fix { margin-top: 6px; }
        .ex-link { font-size: 13px; color: var(--brand-ink); text-decoration: none; border-bottom: 1px dashed currentColor; }
        .ex-ok { font-size: 14px; color: #15803d; }
        .ex-self-row { border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px; margin-bottom: 10px; background: var(--bg); }
        .ex-self-stem { font-size: 14px; line-height: 1.6; }
        .ex-self-key { font-size: 13px; color: var(--ink-2); margin-top: 6px; line-height: 1.6; }
        .self-check button.active { border-color: var(--brand); background: var(--brand); color: #fff; }
        .ex-items { font-size: 13.5px; }
        .ex-line { padding: 9px 0; border-bottom: 1px solid var(--line); line-height: 1.6; }
        .ex-line-detail { font-size: 12.5px; color: var(--ink-2); margin-top: 3px; }
        .ex-tag { display: inline-block; min-width: 20px; text-align: center; border-radius: 4px; font-size: 12px; margin-right: 6px; padding: 0 5px; }
        .ex-tag.ok { color: #15803d; background: #f0fdf4; }
        .ex-tag.no { color: #b91c1c; background: #fef2f2; }
        .ex-tag.wait { color: #92400e; background: #fffbeb; }
        .ex-tag.blank { color: var(--ink-2); background: var(--line); }
    </style>
</head>
<body>
<header class="site-header">
  <a class="brand" href="../">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
      <circle cx="7" cy="7" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <circle cx="25" cy="7" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <circle cx="7" cy="25" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <circle cx="25" cy="25" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <path d="M10.2 7h11.6M7 10.2v11.6M25 10.2v11.6M10.2 25h11.6" stroke="currentColor" stroke-width="1.5"/>
    </svg>
    <span class="brand-copy">
      <span class="brand-name">中国 K-12 知识图谱</span>
      <span class="brand-kicker">自适应诊断</span>
    </span>
  </a>
  <nav class="site-nav" aria-label="主导航">
    <a class="nav-link" href="../">首页</a>
    <a class="nav-link " href="./">知识图谱</a>
    <a class="nav-link active" href="../diagnose/">诊断</a>
    <a class="nav-link" href="../learn/">讲解</a>
    <a class="nav-link" href="../children/">档案</a>
    <a class="nav-link" href="../teacher/">教师</a>

    <a class="nav-link" href="../novel/">小说连载</a>


    <a class="nav-link" href="https://github.com/grantleyzyf-spec/cn-k12-dxyc2286" target="_blank" rel="noopener noreferrer">关于</a>
  </nav>
</header>
<main class="diag">
    <div class="page-head">
        <h1>自适应诊断</h1>
        <p>选一个目标知识点，系统沿必先修关系逐层出题，找出真正卡住的那一步。</p>
    </div>
    <div class="mode-tabs" role="tablist">
        <button class="mode-tab active" id="tab-adaptive" role="tab">自适应诊断</button>
        <button class="mode-tab" id="tab-exam" role="tab">整卷测试 <small>单元 / 期中 / 期末</small></button>
    </div>
    <div class="panel">
      <div id="adaptive-wrap">
                        <div id="setup-area">
                <div class="select-group">
                    <div>
                        <label>学科</label>
                        <select id="subject-select">
                            <option value="">请选择学科</option>
                            <option value="math">📐 数学</option>
                            <option value="chinese">📖 语文</option>
                            <option value="english">🔤 英语</option>
                            <option value="physics">⚡ 物理</option>
                            <option value="chemistry">🧪 化学</option>
                            <option value="biology">🧬 生物</option>
                            <option value="history">📜 历史</option>
                            <option value="geography">🌍 地理</option>
                            <option value="science">🔬 科学</option>
                            <option value="information-technology">💻 信息科技</option>
                            <option value="japanese">🇯🇵 日语</option>
                            <option value="russian">🇷🇺 俄语</option>
                            <option value="german">🇩🇪 德语</option>
                            <option value="french">🇫🇷 法语</option>
                            <option value="spanish">🇪🇸 西班牙语</option>
                            <option value="music">🎵 音乐</option>
                            <option value="art">🎨 美术</option>
                        </select>
                    </div>
                    <div id="edition-row" style="display:none">
                        <label>教材版本</label>
                        <select id="edition-select"></select>
                    </div>
                    <div>
                        <label>目标知识点</label>
                        <select id="topic-select" disabled>
                            <option value="">请先选择学科</option>
                        </select>
                    </div>
                </div>
                <button class="btn" id="start-btn" disabled>开始诊断</button>
            </div>

            <div class="question-area" id="question-area">
                <div class="progress">
                    <span id="progress-text">第 1 题</span>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
                    </div>
                    <span id="progress-total">共 0 题</span>
                </div>
                <div class="question-card">
                    <div class="question-text" id="question-text"></div>
                    <div class="options" id="options"></div>
                    <div class="answer-input" id="answer-input"></div>
                    <div class="feedback" id="feedback"></div>
                </div>
                <button class="btn" id="next-btn">下一题</button>
            </div>

            <div class="result-area" id="result-area">
                <div class="result-card">
                    <div class="result-title">📊 诊断结果</div>
                    <div id="result-content"></div>
                </div>
                <div class="warning">
                    ⚠️ <strong>声明：</strong>本诊断工具基于 AI 生成的初稿数据，未经教师审核。结果仅供参考，不能替代专业教学评估。
                </div>
                <button class="btn" style="margin-top: 20px;" onclick="location.reload()">重新诊断</button>
            </div>
      </div><!-- /adaptive-wrap -->

      <div id="exam-wrap" style="display:none">
        <div id="exam-setup">
          <div class="select-group">
            <div>
              <label>学科</label>
              <select id="exam-subject"><option value="math">数学</option></select>
            </div>
            <div>
              <label>教材版本</label>
              <select id="exam-edition"><option value="人教版">人教版</option></select>
            </div>
            <div>
              <label>册次</label>
              <select id="exam-book"></select>
            </div>
            <div>
              <label>试卷</label>
              <select id="exam-paper-select"></select>
            </div>
          </div>
          <button class="btn" id="exam-start" disabled>开始答题</button>
          <div class="ex-tip">整卷模式按卷面计时、按题给分；交卷后选择/判断/计算/单空填空自动判分，解答题与多空答案对照评分要点由你自评。报告会按知识点算得分率，并给出先修链与补救入口。</div>
        </div>
        <div id="exam-paper" style="display:none"></div>
        <div id="exam-report" style="display:none"></div>
      </div>
    </div>
</main>

    <script src="../assets/children.js"></script>
    <script src="exam.js?v=4"></script>
    <script src="mode-tabs.js?v=1"></script>
    <script src="diag-selector.js?v=1"></script>
    <script src="app.js?v=1"></script>
</body>
</html>
